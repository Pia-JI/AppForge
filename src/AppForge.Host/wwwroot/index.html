<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
<title>AppForge 造物台</title>
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">AF</div>
        <div class="brand-text">
          <h1>AppForge <span>造物台</span></h1>
          <p>说出你要的软件，AI 现场写出来，永久留在桌面</p>
        </div>
      </div>
      <div class="topbar-actions">
        <input id="search" class="search" type="search" placeholder="搜索应用…" autocomplete="off" spellcheck="false" />
        <button id="btn-new" class="btn primary">＋ 新建应用</button>
        <button id="btn-settings" class="btn icon" title="设置（API / 密钥 / 参数）">⚙</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <footer class="statusbar">
      <span id="status-left">正在连接宿主…</span>
      <span id="status-right"></span>
    </footer>
  </div>

  <div id="toast" class="toast-wrap"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/diag.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
